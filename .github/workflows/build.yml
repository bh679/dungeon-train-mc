name: Build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v3
        # Note: NOT setting gradle-home-cache-cleanup: true. The action's
        # cleanup step uses Gradle 9.x APIs (removeUnusedEntriesOlderThan)
        # which crash against our Gradle 8.4 wrapper. Without this flag the
        # cleanup is skipped; the cache grows slightly over time but the
        # build never fails on a transient cache-save outage.

      - run: ./gradlew build --no-daemon

      - name: Upload jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dungeontrain-jar-${{ github.sha }}
          path: build/libs/dungeontrain-*.jar
          if-no-files-found: error
          retention-days: 14

  # Stdlib-only Python guards for the CurseForge + Modrinth modpack configs. No
  # Java/Gradle — python3 is preinstalled on ubuntu-latest — so this runs fast, in
  # parallel with `build`. check-relations.py enforces the invariant that every modpack
  # Include (optional_mods) is also declared as a dependency of the mod in release.yml
  # (the bug that shipped AppleSkin un-declared in PR #390); check-pins.py guards both
  # the exact Sable chain and the un-bundled sibling mods' minimum-version floors;
  # check-overrides.py allowlists the overrides/ tree the pack ships verbatim to players.
  modpack-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Modpack Include ↔ mod dependency consistency
        run: python3 scripts/modpack/check-relations.py

      - name: Modpack Modrinth pins present on every mod
        # Fails CI if a mod is added to modpack.config.json without its Modrinth
        # project+version pin (which would silently drop it from the .mrpack). No network.
        run: python3 scripts/modpack/build-mrpack.py --check-config

      - name: Modpack override allowlist
        # overrides/ is copied verbatim into every player's instance, so a config file the mod
        # holds to its defaults (adventureitemstats.properties today — see AisDataIntegrity)
        # would put EVERY pack user into Free Play. Strict allowlist: any new override file
        # fails until it is added to ALLOWED in the script. No network.
        run: python3 scripts/modpack/check-overrides.py

      - name: Dependency version pins (Sable chain + sibling floors)
        # Two checks. (1) Sable: fails if sable_mod_version (DT's exact mods.toml lock) or
        # the modpack's sable.version drift from gradle.properties sable_version.
        # (2) Siblings: fails if a modpack-pinned AIN/AIS/PMOB/ECP/TE build is OLDER than the
        # <mod>_min_version floor DT declares — i.e. the pack would ship a sibling the mod
        # refuses to load against. No network.
        run: python3 scripts/modpack/check-pins.py

      - name: Modpack manifest + relation tests
        run: |
          python3 scripts/modpack/test_build_manifest.py
          python3 scripts/modpack/test_check_relations.py
          python3 scripts/modpack/test_check_overrides.py
          python3 scripts/modpack/test_build_mrpack.py
          python3 scripts/modpack/test_check_pins.py
          python3 scripts/modpack/test_upload_retry.py
          python3 scripts/modpack/test_reconcile.py
          python3 scripts/modpack/test_wait_for_approval.py

  # Stdlib-only Python guard for the translation provenance sidecars (who translated / who
  # human-reviewed each string). Two flavours, both under localization/ and both repo-side
  # only (the sidecars never ship — but the generated manifests derived from them, at
  # assets/dungeontrain/localization_provenance/, do, and check-provenance.py fails on any
  # drift between the two since the in-game translation editor filters on them):
  #   * per-LINE, for the flat-key UI lang files — dungeontrain at
  #     localization/provenance/<locale>.json plus each sibling mod (AIN/PlayerMob/
  #     DiscordPresence, whose translations are committed here) at
  #     localization/provenance/<namespace>/<locale>.json; and
  #   * per-BOOK, for the long-form narrative books at
  #     localization/narrative_provenance/<locale>.json.
  # Each fails when a translation wave lands strings/books without provenance, when entries
  # drift out of set/order lockstep with their source, or when an entry is malformed — the
  # message carries the fix command (stamp-*-provenance.py --sync). Runs fast and in parallel
  # with `build`, same as modpack-checks.
  localization-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # The check nothing was doing. Both existing guards are self-referential — validate-locale
      # compared each locale to the es_es template (which carried the identical gap) and
      # check-provenance compares each sidecar to its OWN lang file — so a GUI string added to
      # en_us.json alone left nineteen languages showing English with every check green. That
      # shipped twice: 109 keys in v0.619.0 and 144 keys again by 2026-08-30, the second time
      # also blocking the relay import, because players had translated the drifted keys from the
      # in-game editor and there was no line to write them to.
      - name: Every locale carries every English key
        run: python3 scripts/localization/check-lang-parity.py

      # The full structural suite: key sets, file sets, and shape against the es_es template,
      # plus the value checks (placeholders, empty strings, trigger-book title length, note
      # offsets). It ran --values-only until the AIN overlay debt it was tripping over was paid
      # off — vi_vn and fil_ph missing `item_types`, three locales carrying a stray segment
      # `label`, and zh_cn's synonym pool written against a different layout. Those are fixed,
      # so this asks the whole question again. If it ever goes red, fix the locale rather than
      # narrowing the gate: a check that is permanently failing is a check nobody reads.
      - name: Locale trees are structurally intact
        run: |
          locales=$(ls src/main/resources/assets/dungeontrain/lang \
            | sed 's/\.json$//' | grep -v '^en_us$' | tr '\n' ' ')
          python3 scripts/localization/validate-locale.py $locales

      - name: Per-line translation provenance aligned with lang files (all namespaces)
        run: python3 scripts/localization/check-provenance.py

      - name: Per-book narrative provenance aligned with book files
        run: python3 scripts/localization/check-narrative-provenance.py

      # Book prose is Component.literal and names its figures {deaths}, so neither the printf
      # guard on the import side nor the one in the in-game editor can see them. Without this a
      # translation that drops one ships silently — see check-book-placeholders.py.
      - name: Translated books keep every {placeholder} their English original has
        run: python3 scripts/localization/check-book-placeholders.py

      - name: Provenance script tests
        run: |
          python3 scripts/localization/test_check_provenance.py
          python3 scripts/localization/test_stamp_provenance.py
          python3 scripts/localization/test_check_narrative_provenance.py
          python3 scripts/localization/test_stamp_narrative_provenance.py
          python3 scripts/localization/test_provenance_io.py
          python3 scripts/localization/test_import_approved_translations.py
          python3 scripts/localization/test_lang_format.py
          python3 scripts/localization/test_book_format.py
          python3 scripts/localization/test_check_book_placeholders.py
          python3 scripts/localization/test_plural_forms.py
          python3 scripts/localization/test_merge_locale_keys.py
