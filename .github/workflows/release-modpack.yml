name: Release Modpack

# Publishes the Dungeon Train CurseForge MODPACK (project = vars.CURSEFORGE_MODPACK_PROJECT_ID),
# distinct from the mod itself. Dispatched by release.yml right after a successful CurseForge
# mod upload — for REAL (operator-dispatched) releases only; auto-release cascade ticks are
# deliberately skipped (see the `inputs.auto == false` gate on that dispatch step). It first
# POLLS until CurseForge has approved the freshly uploaded DT file (a pack whose manifest
# references an unapproved file is rejected outright), then builds + uploads a matching modpack
# version that bundles that release's DT file plus the pinned Sable dependency, and finally
# VERIFIES that the uploaded version actually became public — CurseForge can accept an upload
# and reject it afterwards.
#
# Not tag-triggered: release.yml is the only production caller. Can also be dispatched manually
# (e.g. with dry_run=true) for testing — see modpack/README.md.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag the modpack should mirror (e.g. v0.293.0)."
        required: true
        type: string
      dt_file_id:
        description: "CurseForge file ID of the Dungeon Train jar uploaded by this release."
        required: true
        type: string
      auto:
        description: "True when dispatched by the auto-release cascade (informational only)."
        required: false
        type: boolean
        default: false
      approval_timeout_minutes:
        description: "How long to wait for CurseForge to approve the DT file before giving up."
        required: false
        type: string
        default: "60"
      dry_run:
        description: "Build + validate the pack but skip the CurseForge upload."
        required: false
        type: boolean
        default: false
      changelog:
        description: "Markdown changelog for the modpack upload. Empty → templated boilerplate."
        required: false
        type: string
        default: ""

# Dedupe re-dispatches of the SAME tag (a re-run supersedes the in-flight one), but let
# different releases publish independently — every release gets its own modpack version.
concurrency:
  group: modpack-release-${{ inputs.tag }}
  cancel-in-progress: true

jobs:
  publish-modpack:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # No explicit ref: checks out the dispatch ref — main in production (release.yml
      # dispatches without --ref), or the feature branch when testing via `gh workflow run
      # --ref <branch>`. This is why the build scripts are reachable during branch testing.
      - uses: actions/checkout@v4

      - name: Validate inputs
        env:
          DT_FILE_ID: ${{ inputs.dt_file_id }}
          APPROVAL_TIMEOUT_MINUTES: ${{ inputs.approval_timeout_minutes }}
        run: |
          if ! [[ "$DT_FILE_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::dt_file_id must be numeric, got '$DT_FILE_ID'"; exit 1
          fi
          if ! [[ "$APPROVAL_TIMEOUT_MINUTES" =~ ^[0-9]+$ ]]; then
            echo "::error::approval_timeout_minutes must be numeric, got '$APPROVAL_TIMEOUT_MINUTES'"; exit 1
          fi

      # The manifest references the DT jar by file id, and CurseForge rejects a pack whose
      # referenced file is not approved yet ("References file with invalid status: <id>").
      # This used to be a fixed `sleep 15m` — a guess. When approval took longer, or never
      # came at all (every DT file after v0.625.0 in Aug 2026), the pack was built around an
      # unapproved file and rejected AFTER upload, leaving this workflow green and the release
      # silently missing from the pack. Ask the real question instead, and stop if the answer
      # is no: a re-dispatch is cheap, a silently missing pack version is not.
      - name: Wait for CurseForge to approve the mod file
        env:
          DT_FILE_ID: ${{ inputs.dt_file_id }}
          APPROVAL_TIMEOUT_MINUTES: ${{ inputs.approval_timeout_minutes }}
          # Authoritative when set; without it the check reads the caching cfwidget mirror.
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
        run: |
          python3 scripts/modpack/wait-for-approval.py \
            --file-id "$DT_FILE_ID" --timeout-minutes "$APPROVAL_TIMEOUT_MINUTES"

      - name: Modpack override allowlist
        # overrides/ ships verbatim to every player. Re-checked here because this workflow is
        # dispatchable with --ref <branch>, which bypasses build.yml's modpack-checks job.
        run: python3 scripts/modpack/check-overrides.py

      - name: Render modpack manifest
        env:
          TAG: ${{ inputs.tag }}
          DT_FILE_ID: ${{ inputs.dt_file_id }}
        run: |
          python3 scripts/modpack/build-manifest.py \
            --dt-file-id "$DT_FILE_ID" \
            --version "$TAG" \
            --output manifest.json
          echo "::group::Rendered manifest.json"
          cat manifest.json
          echo "::endgroup::"

      - name: Publish modpack to CurseForge
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_MODPACK_PROJECT_ID: ${{ vars.CURSEFORGE_MODPACK_PROJECT_ID }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          TAG: ${{ inputs.tag }}
          # Pass via env (not raw ${{ }} in the script) so multi-line markdown can't break/inject
          # the shell. Empty → publish-curseforge.sh falls back to its templated boilerplate.
          CHANGELOG: ${{ inputs.changelog }}
        run: |
          if [ -z "${CURSEFORGE_MODPACK_PROJECT_ID:-}" ]; then
            echo "::error::CURSEFORGE_MODPACK_PROJECT_ID variable is not set — cannot publish the modpack."
            exit 1
          fi
          if [ -z "${CURSEFORGE_TOKEN:-}" ] && [ "${DRY_RUN:-}" != "1" ]; then
            echo "::error::CURSEFORGE_TOKEN secret is not set — cannot publish the modpack."
            exit 1
          fi
          bash scripts/modpack/publish-curseforge.sh --manifest manifest.json --tag "$TAG" --changelog "$CHANGELOG"

      # An HTTP 200 from /upload-file does NOT mean the pack was published. CurseForge
      # validates the manifest asynchronously and can reject the file afterwards — e.g.
      # `Invalid manifest.json file: 500 - "…An unhandled exception occurred…"`. When that
      # happens this workflow stays green and the release goes missing from the pack with no
      # signal anywhere. That is exactly how the pack silently fell 13 releases behind.
      # Poll the public listing and fail loudly if the version never shows up.
      #
      # Skipped on dry runs (nothing was uploaded). Failing here does not undo the upload —
      # it exists to make a rejection visible the same day instead of weeks later.
      - name: Verify the pack version actually published
        if: ${{ !inputs.dry_run }}
        env:
          TAG: ${{ inputs.tag }}
          CURSEFORGE_MODPACK_PROJECT_ID: ${{ vars.CURSEFORGE_MODPACK_PROJECT_ID }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          python3 scripts/modpack/reconcile.py --verify "$TAG" \
            --platform curseforge --timeout-minutes 30 --poll-seconds 60
