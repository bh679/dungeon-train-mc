name: Verify CurseForge Upload

# Watches a release's Dungeon Train jar until CurseForge approves or rejects it.
#
# An upload returning 200 is not a publish: CurseForge validates and approves files after the
# upload, and can reject them then. release.yml used to poll for this itself, for 30 minutes,
# which made every release ~30 minutes slower than its actual publishing — and approval
# routinely takes longer than that anyway. release.yml now dispatches this workflow instead,
# so the wait happens off the release's critical path, with a window long enough to get an
# answer (300 min — the same approval wait release-modpack.yml uses).
#
# With the CURSEFORGE_API_KEY secret, reconcile.py polls the file's status on the official API:
#
#   Green  Approved.
#   Red    Rejected, ChangesRequired, malware, deleted or failed publishing: recover with
#          `gh workflow run reupload-curseforge.yml -f tag=<tag>`, which re-publishes the tag's
#          existing artifact without burning a version number. Also red: the key was refused.
#   Green + warning  Still under review at the timeout, or the file could not be read. Neither
#          is a rejection, so do NOT re-upload. Manual review holds outlast any one run: a
#          rejection after the timeout is not caught here, so re-dispatch to check again.
#
# Without the key it can only read the cached cfwidget mirror, which cannot prove absence and
# can't see files under review or rejected. It answers at once (listed, or unknown) and never
# fails, so a quick green run there says nothing about a file that isn't listed.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag whose CurseForge file to check (e.g. v0.1154.0)."
        required: true
        type: string
      file_id:
        description: "CurseForge file id the release uploaded. Needed to tell a rejection from a hold."
        required: false
        type: string
        default: ""
      timeout_minutes:
        description: "How long to watch the file before stopping (max 315). Shorten for a test run."
        required: false
        type: number
        default: 300

# One check per tag; a re-dispatch of the same tag supersedes the in-flight one.
concurrency:
  group: verify-curseforge-${{ inputs.tag }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 320
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Wait for CurseForge to approve or reject the file
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          CF_PROJECT: ${{ vars.CURSEFORGE_PROJECT_ID }}
          RELEASE_TAG: ${{ inputs.tag }}
          CF_FILE_ID: ${{ inputs.file_id }}
          TIMEOUT_MINUTES: ${{ inputs.timeout_minutes }}
        run: |
          set -euo pipefail
          echo "Checking CurseForge for $RELEASE_TAG (file ${CF_FILE_ID:-unknown})…"
          python3 scripts/modpack/reconcile.py \
            --verify "$RELEASE_TAG" \
            ${CF_FILE_ID:+--file-id "$CF_FILE_ID"} \
            --platform curseforge \
            --curseforge-project "$CF_PROJECT" \
            --timeout-minutes "$TIMEOUT_MINUTES" \
            --poll-seconds 300
