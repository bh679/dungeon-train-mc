# NeoForge in-game update notifier. Rendered into neoforge.mods.toml as `updateJSONURL`;
# NeoForge fetches this static JSON at startup and shows an "Update available" badge on the
# Mods screen when the installed build is behind `promos."<mc>-latest"`. Notification only —
# it never downloads anything. The file is regenerated + committed to main by release.yml on
# every release (anchored to the release TAG, not mod_version, which is always bumped past the
# release). See scripts/release-notes/build-update-json.py and docs at
# https://docs.neoforged.net/docs/misc/updatechecker/
update_json_url=https://raw.githubusercontent.com/bh679/dungeon-train-mc/main/update.json

# Sable — replaces Valkyrien Skies as the physics dependency in Phase 2 of the
# 1.21.1 migration. VS upstream (https://github.com/ValkyrienSkies/Valkyrien-Skies-2)
# is still 1.20.1-only as of 2026-04-28; Sable (https://github.com/ryanhcode/sable,
# PolyForm Shield 1.0.0) actively ships NeoForge 1.21.1 builds.
# Modrinth project: https://modrinth.com/mod/sable
# ⚠️ When bumping this, ALSO update (all four move together — CI's check-pins.py enforces it):
#   1. sable_mod_version below (= this value with the +mc… suffix stripped)
#   2. modpack/modpack.config.json -> sable.file_id       (matching CurseForge file)
#   3. modpack/modpack.config.json -> sable.modrinth_version (matching Modrinth version)
#   4. modpack/modpack.config.json -> sable.version       (= this exact value)
#   5. RE-VERIFY the #646 soft-freeze mixins against the new bytecode: re-enumerate the per-body
#      steps in SubLevelPhysicsSystem/ServerSubLevel/RapierPhysicsPipeline and confirm the gated set
#      (updatePose, prePhysicsTick, applyQueuedForces + the pipeline read/write gates) still covers
#      the per-body work. Soft-freeze never removes a body, so a missed one just costs perf, not a
#      crash. See mixin/*FreezeMixin.java + ship/sable/PhysicsFreeze.java.
#   6. RE-CHECK the bundled Sodium/Iris render pair. Sable's neoforge.mods.toml declares Sodium
#      INCOMPATIBLE below 0.8.12-alpha.2+mc1.21.1 (it renders sub-levels through Sodium's modern
#      pipeline). The modpack ships Sodium (modpack.config.json, currently 0.8.12 stable) + Iris
#      (currently 1.8.14-beta.1 — the only Iris build compatible with Sodium 0.8.x on 1.21.1, still
#      a beta). Iris↔Sodium are version-locked to each other; a Sable bump that raises the Sodium
#      floor can strand Iris. If you bump Sable, confirm the shipped Sodium still clears the new
#      floor AND that Iris still targets that Sodium line.
#      Re-checked at 2.0.5 (2026-08-22): the floor is UNCHANGED at 0.8.12-alpha.2+mc1.21.1,
#      so the shipped Sodium 0.8.12 / Iris 1.8.14-beta.1 pair still clears it — no render
#      change was needed for this bump.
# Sable storage seams to re-verify against the new bytecode on a bump (#1508):
#      mixin/SubLevelStorageFileNoDsyncMixin, mixin/SubLevelHoldingChunkMapSaveTimingMixin.
# Both modpacks pin Sable to this exact version. See modpack/README.md.
sable_version=2.0.5+mc1.21.1

# The bare modId version Sable declares in ITS OWN neoforge.mods.toml (no +mc… suffix — that
# suffix is only Modrinth's artifact coordinate). DT's neoforge.mods.toml pins Sable to EXACTLY
# this (versionRange="[${sable_mod_version}]") so the mod refuses to load against an untested
# Sable build. Must equal sable_version's leading semver (the part before '+'); CI enforces it.
sable_mod_version=2.0.5

# Distant Horizons — OPTIONAL companion, compile-only. DT never ships or requires DH; these two
# values only pick the API jar javac compiles the in-band render suppression against
# (client/DistantHorizonsUpsideDown). `distant_horizons_version` is the build the modpack pins
# (modpack/modpack.config.json → optional_mods "Distant Horizons"); `distant_horizons_api_version`
# is the API version THAT build reports (ModInfo.API_*_VERSION inside DH's own jar) — the two move
# independently, so when you re-pin DH in the modpack, re-read its API version rather than assuming.
distant_horizons_version=2.4.3-b
distant_horizons_api_version=5.0.0

# Fast Paintings — REQUIRED third-party dependency (MehVahdJukaar). Turns every painting entity
# into fastpaintings:painting BLOCKS, which is what makes paintings first-class on the train and
# in templates: blocks ride Sable and stamp from structure NBT, hanging entities never quite did.
# A template holding a fastpaintings block is air for anyone without the mod (shared carriages),
# hence a hard `required` dep in neoforge.mods.toml, not a modpack companion. Values are the
# Modrinth VERSION IDS (the version numbers are shared across loaders / re-uploads, so they are
# ambiguous on the Modrinth maven); the human version is in the comment.
#   fastpaintings 1.21-1.3.0  — Modrinth project z3TzcquW, CurseForge 883287 / file 7305762
#   moonlight    1.21.1-3.6.4 — Fast Paintings' own required library (Modrinth twkfQtEc,
#                               CurseForge 499980 "selene" / file 8850087)
# ⚠️ Bumping either ⇒ also refresh modpack/modpack.config.json (file_id + modrinth_version) and
# the floors below, which neoforge.mods.toml renders as [x,). Check fastpaintings hasn't grown a
# mirror()/rotate() of its own — compat/PaintingTransformProcessor would then double-apply.
fastpaintings_version=PQ155hbf
fastpaintings_min_version=1.21-1.3.0
moonlight_version=BnjVBHVl
moonlight_min_version=1.21.1-3.6.4

