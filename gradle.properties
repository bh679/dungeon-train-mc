# Stream Detect + DPI Bypass Detect — OPTIONAL client-side sibling add-ons (NOT bundled, NOT
# required). They hold the process-name detection DT used to do itself (OBS/Streamlabs for the
# Videos share tab; zapret/GoodbyeDPI for the relay-blocked warning), moved out so DT's own
# CurseForge reviews never wait on process-list reading. DT keeps all the UI and calls them through
# compat/StreamDetectBridge + compat/DpiBypassDetectBridge; without them it acts as if nothing was
# found. Both modpacks ship them ON. Fetched via the shared Ivy `bh679` repo
# (streamdetect-neoforge-<v>.jar / dpibypassdetect-neoforge-<v>.jar from bh679/<mod>-mc).
# No _min_version: optional deps declare a fixed `[0.1.0,)` floor in neoforge.mods.toml.
streamdetect_version=0.1.0
dpibypassdetect_version=0.1.0

# Dungeon Backup — sibling mod: DT's own player-data protection system, extracted into a
# library in v0.862.0 (bh679/dungeonbackup-mc). Migration of player data out of config/,
# rolling zip restore points in <gameDir>/dungeontrain/backups + the OS app-data mirror,
# per-version pruning, the "Missing … Data" title-screen recovery card, /dtbackup +
# /dtrestore (now aliases of /dungeonbackup backup|restore). DT describes its data ONCE in
# data.DungeonTrainBackup; a new folder under the data root is protected with no code change.
# Owns config/dungeonbackup-client.toml (backup mode + backups per version — the two
# settings that used to live in dungeontrain-client.toml; existing players' values reset to
# the defaults, which is the safest rung). The launch-flag override -Ddungeontrain.backups
# still works alongside -Ddungeonbackup.backups.
# HYBRID contract (unlike the six un-bundled siblings above): still jarJar'd, so Modrinth users
# (mod page + modpack) and manual installs get it built in — AND declared
# dungeon-train-backup(required) on CurseForge + shipped as a CurseForge modpack Include, so the
# CF app installs it as its own jar and its CF page gets the credit. NeoForge's JarSelector drops
# the nested copy whenever a top-level mods/ copy is present, so the two paths coexist.
# Fetched for compile from https://github.com/bh679/dungeonbackup-mc/releases via the shared
# Ivy `bh679` repo (asset dungeonbackup-neoforge-<v>.jar — flat, no +mc suffix).
# CurseForge: project 1694135, slug dungeon-train-backup (APPROVED 2026-09-15). Modrinth: no
# listing needed for this contract (embedded); it is deliberately absent from the Modrinth relation
# list, the Modrinth modpack (`curseforge_only` in modpack.config.json) and client SiblingMod.
# _version = the build nested in DT's jar; _min_version = the floor a CF-installed top-level copy
# must clear (mods.toml range). 0.2.0 = 0.1.0 + version bump for the CF publish.
# ⚠️ Bumping the min floor ⇒ also refresh modpack/modpack.config.json's entry.
dungeonbackup_version=0.2.0
dungeonbackup_min_version=0.2.0

# Sable Fence & Trapdoor Fix — sibling mod (bh679/sable-fence-trapdoor-fix-mc), same HYBRID
# contract as Dungeon Backup (jarJar'd for Modrinth/manual, required external on CurseForge).
# Clips fence/wall posts that protrude into a flush block above (trapdoor/carpet/slab) out of
# Sable's sub-level collision shapes so riders stop jittering on carriages — the
# ProtrudingShapeClip + SubLevelEntityCollisionShapeClipMixin that DT shipped itself in
# 0.862.0–0.887.0, extracted. DT MUST NOT carry its own copy of that mixin again or Sable's
# getCollisionShape call gets wrapped twice.
# Asset name is sable_fence_trapdoor_fix-<v>.jar (NOT the flat <module>-neoforge-<v>.jar the
# other siblings use) ⇒ its own Ivy repo in build.gradle.
# CurseForge: project 1694049, slug sable-fence-trapdoor-fix (APPROVED 2026-09-15). Modrinth:
# embedded, no listing needed (`curseforge_only` in modpack.config.json).
# ⚠️ Bumping the min floor ⇒ also refresh modpack/modpack.config.json's entry.
# ⚠️ Bumping sable_version ⇒ check the fix's own Sable floor + re-run its mixin-target verify.
sablefencetrapdoorfix_version=0.1.2
sablefencetrapdoorfix_min_version=0.1.2

