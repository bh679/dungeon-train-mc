// generateApprovedMods — the baked Free Play whitelist, assembled at build time.
//
// Rule (Brennan, 2026-09-27): every mod the modpack ships, every sibling, every dependency is
// approved AUTOMATICALLY unless he says otherwise. Hand-maintaining those ids is how the relay
// review found our own jarJar'd siblings missing and 13 store slugs that can never match a modId.
// So the four "it's ours" groups are generated from the files that already define membership:
//
//   dungeon_train          mod_id + the [[mods]] of every jarJar'd jar (recursing into its own jarjar/)
//   required_dependencies  [[dependencies.<mod_id>]] type="required" in the mods.toml template
//   optional_compat        [[dependencies.<mod_id>]] type="optional"
//   modpack_roster         modpack/modpack.config.json: sable + optional_mods[].mod_ids
//                          (real modIds read from each pinned jar by scripts/modpack/check-mod-ids.py;
//                          an entry with "whitelist": false is left out — Brennan's opt-out)
//
// Everything else (performance, visual, libraries, …) is judged by hand and lives in
// src/main/whitelist/approved_mods.curated.json. The output keeps the resource path
// ApprovedModList reads, so the loader and the relay's copy of the file are unchanged.
// An id appears once: platform first, then the generated groups, then the curated rest.

def curatedFile = file('src/main/whitelist/approved_mods.curated.json')
// Every approved mod's published 1.21.1 NeoForge file hashes, pulled by hand with
// scripts/modpack/pull-approved-hashes.py and committed — the baked seed of the hash-verified
// whitelist beyond the modpack's own pins.
def hashesFile = file('src/main/whitelist/approved_hashes.json')
def modsTomlFile = file('src/main/templates/META-INF/neoforge.mods.toml')
def modpackFile = file('modpack/modpack.config.json')
def outDir = layout.buildDirectory.dir('generated/sources/approvedMods')
def modIdPattern = ~/^[a-z][a-z0-9_]{1,63}$/

// Only the jars we embed, not their transitive deps — matching what jarJar puts in our jar.
def jarJarJars = configurations.detachedConfiguration(
        *configurations.jarJar.dependencies.collect { it.copy() }).tap { transitive = false }

// modIds declared by the [[mods]] tables of a mods.toml (dependency tables are ignored).
def tomlModIds = { String text ->
    def ids = []
    def inMods = false
    text.eachLine { raw ->
        def line = raw.split('#', 2)[0].trim()
        if (line.startsWith('[')) { inMods = line.replace(' ', '') == '[[mods]]'; return }
        def m = line =~ /modId\s*=\s*["']([^"']+)["']/
        if (inMods && m.find()) ids << m.group(1)
    }
    ids
}

// A jar's package fingerprint — the Groovy twin of check-mod-ids.py jar_packages / cheat/PackageFingerprint:
// the top two segments of every .class path (three under com.github-style hosts), shaded commons
// dropped, sorted, at most 64. Embedded jars included.
def pkgDrop = ['org.apache', 'org.slf4j', 'org.jetbrains', 'org.intellij', 'org.objectweb', 'org.lwjgl', 'org.joml',
               'org.spongepowered', 'org.yaml', 'org.json', 'org.checkerframework', 'org.jspecify', 'org.codehaus',
               'com.google', 'com.mojang', 'com.sun', 'com.electronwill', 'com.fasterxml', 'io.netty', 'kotlin',
               'kotlinx', 'javax', 'jakarta', 'java', 'sun', 'net.minecraft', 'net.neoforged', 'net.minecraftforge',
               'net.fabricmc', 'scala', 'groovy', 'it.unimi', 'cpw.mods', 'mixin', 'META-INF']
def pkgHosts = ['com.github', 'io.github', 'org.github', 'dev.github', 'com.gitlab', 'io.gitlab']
def packageOf = { String name ->
    if (!name.endsWith('.class') || name.startsWith('META-INF/')) return null
    def parts = name.split('/').toList(); parts = parts[0..<parts.size() - 1]
    if (parts.size() < 2) return null
    def key = parts[0..1].join('.')
    if (key in pkgHosts && parts.size() >= 3) key = parts[0..2].join('.')
    if (pkgDrop.any { d -> key == d || key.startsWith(d + '.') }) return null
    (key ==~ /[A-Za-z_$][\w$]*(\.[A-Za-z_$][\w$]*){1,2}/) ? key : null
}
def jarPackages
jarPackages = { byte[] data, int depth = 0 ->
    def out = new TreeSet<String>()
    new java.util.zip.ZipInputStream(new ByteArrayInputStream(data)).withCloseable { zip ->
        for (def e = zip.nextEntry; e != null; e = zip.nextEntry) {
            def key = packageOf(e.name)
            if (key) out << key
            else if (depth < 2 && e.name.startsWith('META-INF/jarjar/') && e.name.endsWith('.jar')) out.addAll(jarPackages(zip.readAllBytes(), depth + 1))
        }
    }
    out.take(64) as List
}

// Every modId a jar loads: its own [[mods]] plus each META-INF/jarjar/*.jar, recursively.
// A plain library (no mods.toml, e.g. joml-primitives) contributes nothing — NeoForge doesn't list it.
def jarModIds
jarModIds = { byte[] data ->
    def ids = []
    def nested = []
    new java.util.zip.ZipInputStream(new ByteArrayInputStream(data)).withCloseable { zip ->
        for (def e = zip.nextEntry; e != null; e = zip.nextEntry) {
            if (e.name in ['META-INF/neoforge.mods.toml', 'META-INF/mods.toml']) {
                ids.addAll(tomlModIds(new String(zip.readAllBytes(), 'UTF-8')))
            } else if (e.name.startsWith('META-INF/jarjar/') && e.name.endsWith('.jar')) {
                nested << zip.readAllBytes()
            }
        }
    }
    nested.each { ids.addAll(jarModIds(it)) }
    ids
}

tasks.register('generateApprovedMods') {
    inputs.file curatedFile
    inputs.file hashesFile
    inputs.file modsTomlFile
    inputs.file modpackFile
    inputs.files jarJarJars
    inputs.property 'modId', mod_id
    outputs.dir outDir

    doLast {
        def slurper = new groovy.json.JsonSlurper()
        def curated = slurper.parse(curatedFile)
        def selfId = mod_id as String

        // dungeon_train: us + everything we embed.
        def embedded = [selfId]
        jarJarJars.files.sort { it.name }.each { embedded.addAll(jarModIds(it.bytes)) }

        // required_dependencies / optional_compat: the mods.toml template, split by type.
        def declared = [required: [], optional: []]
        def blocks = modsTomlFile.text.split(/(?m)^\s*\[\[/)
        blocks.findAll { it.startsWith('dependencies.') }.each { block ->
            def id = (block =~ /modId\s*=\s*"([^"]+)"/)
            def type = (block =~ /type\s*=\s*"([^"]+)"/)
            if (id.find() && type.find() && !id.group(1).contains('$')) {
                declared.get(type.group(1), []) << id.group(1)
            }
        }

        // modpack_roster: the real modIds every whitelisted modpack entry was verified to load.
        def config = slurper.parse(modpackFile)
        def roster = []
        def missing = []
        ([['Sable', config.sable]] + config.optional_mods.collect { [it.name ?: it.slug, it] }).each { label, entry ->
            if (entry.whitelist == false) return
            if (!entry.mod_ids) { missing << label; return }
            roster.addAll(entry.mod_ids)
        }
        if (missing) {
            throw new GradleException("modpack.config.json entries without mod_ids: ${missing.join(', ')}. "
                + 'Run `python3 scripts/modpack/check-mod-ids.py --fill`, or set "whitelist": false.')
        }

        def generated = new LinkedHashMap()
        generated.dungeon_train = [
            why: 'Dungeon Train itself and every mod shipped inside our jar (siblings, bundled libraries). '
               + 'GENERATED from the jarJar dependencies in build.gradle.',
            ids: embedded]
        generated.required_dependencies = [
            why: 'Mods Dungeon Train declares as REQUIRED in neoforge.mods.toml — the game will not load '
               + 'without them, so every player has them. GENERATED from the mods.toml template.',
            ids: declared.required]
        generated.optional_compat = [
            why: 'Mods Dungeon Train declares an optional compat entry for in neoforge.mods.toml and has '
               + 'tested against. GENERATED from the mods.toml template.',
            ids: declared.optional]
        generated.modpack_roster = [
            why: 'Every mod either modpack ships (modpack/modpack.config.json), on by default or opt-in. '
               + 'Approving these is not a judgement call — we put them on the player\'s disk. '
               + 'GENERATED from each entry\'s mod_ids (read from the pinned jar).',
            ids: roster]

        // Assemble: platform, generated, then the remaining curated groups — each id once.
        def seen = new HashSet<String>()
        def bad = []
        def take = { List ids ->
            ids.collect { (it as String).trim().toLowerCase() }.findAll { id ->
                if (!(id ==~ modIdPattern)) { bad << id; return false }
                seen.add(id)
            }
        }
        def groups = new LinkedHashMap()
        def curatedGroups = curated.groups as Map
        def ordered = [:]
        if (curatedGroups.platform) ordered.platform = curatedGroups.platform
        ordered.putAll(generated)
        curatedGroups.each { k, v -> if (k != 'platform') ordered[k] = v }
        ordered.each { key, group ->
            def out = new LinkedHashMap(group as Map)
            out.ids = take(group.ids as List)
            if (out.ids) groups[key] = out
        }
        if (bad) {
            throw new GradleException("Not modIds (store slug pasted in?): ${bad.unique().join(', ')}")
        }

        // hashes: the hash-verified whitelist's baked seed — every file the modpack pins (sha1 recorded
        // by check-mod-ids.py --fill) and every jar we embed. A stock install then passes the FILE
        // check offline, before the relay has been asked; everything else is verified live.
        def hashes = new TreeSet<String>()
        ([config.sable] + config.optional_mods).each { entry ->
            if (entry.whitelist == false) return
            if (entry.sha1 ==~ /[0-9a-f]{40}/) hashes << (entry.sha1 as String)
        }
        jarJarJars.files.each { f ->
            hashes << java.security.MessageDigest.getInstance('SHA-1').digest(f.bytes).encodeHex().toString()
        }
        // The pulled catalogue: every approved id must have a record (matched or unmatched), so a
        // newly approved mod fails the build until pull-approved-hashes.py has been run for it —
        // the same contract check-mod-ids.py enforces for the modpack roster.
        def pulled = hashesFile.exists() ? slurper.parse(hashesFile) : [byMod: [:], unmatched: []]
        def pulledIds = (pulled.byMod?.keySet() ?: []) + (pulled.unmatched ?: [])
        // Mirrors UnapprovedModIntegrity.EXEMPT_IDS: judged by id alone, never hashed (dtmodverify is the engine itself).
        def exemptIds = ['minecraft', 'neoforge', 'forge', selfId, 'dtmodverify'] as Set
        def noRecord = seen.findAll { id -> !(id in exemptIds) && !id.startsWith('fabric_') && !(id in pulledIds) }
        if (noRecord) {
            throw new GradleException("Approved ids with no file-hash record: ${noRecord.sort().join(', ')}. "
                + 'Run `python3 scripts/modpack/pull-approved-hashes.py` and commit src/main/whitelist/approved_hashes.json.')
        }
        def pulledHashes = 0
        (pulled.byMod ?: [:]).each { id, rec ->
            if (id in seen) (rec.sha1 ?: []).each { h -> if (h ==~ /[0-9a-f]{40}/) { hashes << (h as String); pulledHashes++ } }
        }

        // knownPackages: what each approved mod's code looks like — pulled records, the modpack's
        // pinned jars (check-mod-ids.py --fill), and the jars we embed. The file check's second tier:
        // an unknown hash whose packages are the claimed mod's is plausible, not Free Play.
        def knownPackages = new TreeMap<String, List<String>>()
        (pulled.byMod ?: [:]).each { id, rec -> if (id in seen && rec.packages instanceof List) knownPackages[id] = rec.packages.collect { it as String } }
        ([config.sable] + config.optional_mods).each { entry ->
            if (entry.whitelist == false || !(entry.packages instanceof List)) return
            (entry.mod_ids ?: []).each { id -> if ((id as String) in seen) knownPackages[id as String] = entry.packages.collect { it as String } }
        }
        jarJarJars.files.sort { it.name }.each { f ->
            def pk = jarPackages(f.bytes)
            jarModIds(f.bytes).each { id -> if ((id as String) in seen) knownPackages[id as String] = pk }
        }

        def result = new LinkedHashMap()
        result.comment = ['GENERATED by the generateApprovedMods Gradle task (gradle/approved-mods.gradle) — do not edit.',
                          'Hand-curated groups live in src/main/whitelist/approved_mods.curated.json.'] + (curated.comment ?: [])
        result.prefixes = curated.prefixes ?: []
        result.prefixesWhy = curated.prefixesWhy ?: []
        result.groups = groups
        result.hashesWhy = 'SHA-1 of every file the modpack pins, every jar embedded in ours, and every published ' +
            '1.21.1 NeoForge file of each approved mod — approved as files offline. GENERATED from modpack.config.json ' +
            'sha1 fields, the jarJar dependencies and src/main/whitelist/approved_hashes.json (pull-approved-hashes.py).'
        result.hashes = hashes as List
        result.knownPackagesWhy = 'Package fingerprint of each approved mod\'s published jars (pull-approved-hashes.py, ' +
            'modpack pins, embedded jars). A file whose hash is unknown but whose packages are the claimed mod\'s is ' +
            'plausible, not Free Play; one whose packages are not is suspect.'
        result.knownPackages = knownPackages

        def outFile = outDir.get().file("assets/${selfId}/cheat/approved_mods.json").asFile
        outFile.parentFile.mkdirs()
        def json = new groovy.json.JsonGenerator.Options().disableUnicodeEscaping().build().toJson(result)
        outFile.setText(groovy.json.JsonOutput.prettyPrint(json) + '\n', 'UTF-8')
        logger.lifecycle("generateApprovedMods: ${seen.size()} approved ids "
            + "(${embedded.size()} embedded, ${declared.required.size()} required, "
            + "${declared.optional.size()} optional, ${roster.unique(false).size()} modpack), "
            + "${hashes.size()} file hashes (${pulledHashes} pulled for ${(pulled.byMod ?: [:]).size()} ids, "
            + "${(pulled.unmatched ?: []).size()} unmatched), package knowledge for ${knownPackages.size()} ids")
    }
}
sourceSets.main.resources.srcDir(files(outDir) { builtBy 'generateApprovedMods' })
neoForge.ideSyncTask tasks.named('generateApprovedMods')
