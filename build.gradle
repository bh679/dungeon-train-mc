// Dungeon Train — Minecraft mod (NeoForge 1.21.1).
// MIGRATION PHASE 2: physics dependency is Sable (PolyForm Shield 1.0.0).
// See plans/modular-scribbling-thunder.md for the Phase 2 migration plan.

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.141'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '**/*.bbmodel'
    exclude 'src/generated/**/.cache'
    exclude '**/narratives/originals/**'   // raw author .txt drafts — never loaded at runtime
    exclude '**/narratives/unused/**'      // held-back .txt content — never loaded at runtime
    exclude '**/CLAUDE.md'                 // authoring docs (uppercase-named) — never a MC resource
}

repositories {
    // Maven Central for general libs (joml-primitives, JUnit).
    mavenCentral()

    // Modrinth — hosts Sable's mod jars. Sable does not publish to a dedicated
    // Maven, so we pull via Modrinth's Maven proxy (api.modrinth.com/maven).
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }

    // Flat-named bh679 sibling releases. Ivy patternLayout maps the coordinates
    // bh679:<module>:<v> to the release asset URL
    // https://github.com/bh679/<module>-mc/releases/download/v<v>/<module>-neoforge-<v>.jar.
    // metadataSources { artifact() } lets Gradle resolve directly from the jar
    // (no ivy.xml exists at the URL). content { includeGroup } scopes probes to
    // bh679 only so Gradle won't hit GitHub for every dependency.
    // Siblings that ship multi-MC-version releases (suffixed asset names) are excluded
    // here and get their own repo below.
    ivy {
        name = 'GitHubReleases'
        url = 'https://github.com/'
        patternLayout {
            artifact '[organization]/[module]-mc/releases/download/v[revision]/[module]-neoforge-[revision].[ext]'
        }
        metadataSources { artifact() }
        content {
            includeGroup 'bh679'
            excludeModule('bh679', 'playermob')
            excludeModule('bh679', 'adventureitemnames')
        }
    }

    // adventureitemnames-mc 0.46.0+ added Minecraft 1.20.1 builds, so its NeoForge asset name
    // gained a `+<mcversion>` suffix (adventureitemnames-neoforge-0.48.0+1.21.1.jar) instead of
    // the flat adventureitemnames-neoforge-<v>.jar of 0.45.0 and earlier — same break PlayerMob
    // hit at its 0.48.0. This is why the auto-release cascade sat on AIN 0.45.0 from 0.46.0's
    // release (2026-06-23) until this repo was added: every tick's verification build failed to
    // resolve the bumped coordinate and reverted itself, silently and without a diff.
    // Separate ivy repo, scoped to just the adventureitemnames module, pinned to DT's MC version.
    ivy {
        name = 'GitHubReleasesAdventureItemNames'
        url = 'https://github.com/'
        patternLayout {
            artifact "[organization]/[module]-mc/releases/download/v[revision]/[module]-neoforge-[revision]+${minecraft_version}.[ext]"
        }
        metadataSources { artifact() }
        content { includeModule('bh679', 'adventureitemnames') }
    }

    // playermob-mc 0.48.0+ ships builds for multiple MC versions per release, so its
    // NeoForge asset name gained a `+<mcversion>` suffix (e.g. playermob-neoforge-0.71.0+1.21.1.jar)
    // instead of the flat playermob-neoforge-<v>.jar the other bh679 sibling mods still use.
    // Separate ivy repo, scoped to just the playermob module, pinned to DT's MC version.
    ivy {
        name = 'GitHubReleasesPlayerMob'
        url = 'https://github.com/'
        patternLayout {
            artifact "[organization]/[module]-mc/releases/download/v[revision]/[module]-neoforge-[revision]+${minecraft_version}.[ext]"
        }
        metadataSources { artifact() }
        content { includeModule('bh679', 'playermob') }
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // Local-relay testing seam: point the dev client at a locally-run dp-relay instead of the
            // branch-routed dev/live cap, e.g.
            //   ./gradlew runClient -PrelayBaseUrl=http://127.0.0.1:3005/<CAP>
            // Injected here rather than inherited from the shell because a forked run inherits the
            // long-lived Gradle DAEMON's environment, not the invoking shell's. Unset → normal routing.
            def localRelay = project.findProperty('relayBaseUrl') ?: System.getenv('DUNGEONTRAIN_RELAY_BASE_URL')
            if (localRelay) {
                environment.put('DUNGEONTRAIN_RELAY_BASE_URL', localRelay.toString())
            }
            // Server-perf-harness seam: ./gradlew runClient -PquickJoin=127.0.0.1:25571 auto-connects
            // the dev client to a dedicated server instead of stopping at the main menu. The A/B
            // harness measures the SERVER's [mspt], but the train is player-gated (TrainCarriageAppender
            // returns early when players.isEmpty()), so a rider has to be aboard for there to be
            // anything to measure. Property rather than env var for the same daemon-environment reason
            // as relayBaseUrl above. Do NOT also pass --gameDir; ModDevGradle already supplies it and
            // MC rejects the duplicate.
            def quickJoin = project.findProperty('quickJoin')
            if (quickJoin) {
                programArgument '--quickPlayMultiplayer'
                programArgument quickJoin.toString()
            }
            // Perf-test mode: ./gradlew runClient -PperfTest [-PperfSeed=<long>]. The dev quick-world
            // is then created flat (dungeontrain:dungeon_train_flat) with a PINNED seed, and the quiet
            // game rules are applied on server start. See perf/PerfTestMode. Property rather than env
            // var for the same daemon-environment reason as relayBaseUrl above.
            if (project.hasProperty('perfTest')) {
                systemProperty 'dungeontrain.perfTest', 'true'
            }
            if (project.hasProperty('perfSeed')) {
                systemProperty 'dungeontrain.perfSeed', project.property('perfSeed').toString()
            }
            // DPI-bypass notice seam: ./gradlew runClient -PdpiBypassTest=winws.exe makes
            // DpiBypassDetector report that process without looking at the real process table, so
            // the title-screen notice can be seen and screenshotted on a machine that isn't running
            // zapret. Property rather than env var for the same daemon-environment reason as
            // relayBaseUrl above.
            if (project.hasProperty('dpiBypassTest')) {
                systemProperty 'dungeontrain.dpi_bypass_test', project.property('dpiBypassTest').toString()
            }
        }

        server {
            server()
            programArgument '--nogui'
            // Headless-test seam: run the dedicated server out of its own game directory, e.g.
            //   ./gradlew runServer -PserverDir=run-server
            // Needed when a client and a server run at once — they would otherwise both write
            // run/logs/latest.log and clobber each other's log. Also gives the server pristine
            // configs, so a locally-edited run/config can't taint an integrity test.
            if (project.hasProperty('serverDir')) {
                gameDirectory = file(project.property('serverDir').toString())
            }
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // Same local-relay seam as the client above. The SERVER is what fetches the community
            // book + narrative pools (SharedBookRefreshEvents ticks server-side), so verifying that
            // half against a local dp-relay needs it here too — and a dedicated server needs no GUI,
            // which makes it the only way to test those fetches unattended.
            def localRelay = project.findProperty('relayBaseUrl') ?: System.getenv('DUNGEONTRAIN_RELAY_BASE_URL')
            if (localRelay) {
                environment.put('DUNGEONTRAIN_RELAY_BASE_URL', localRelay.toString())
            }
            // Determinism-harness seam: ./gradlew runServer -PgenDetLog enables the flag-gated
            // [gen.det] worldgen diagnostics (GenDeterminismLog). A project property rather than an
            // env var because the forked server inherits the Gradle DAEMON's environment, not the
            // invoking shell's (same reason as relayBaseUrl above).
            if (project.hasProperty('genDetLog')) {
                systemProperty 'dungeontrain.genDeterminismLog', 'true'
            }
            // Perf-test mode on a dedicated server: ./gradlew runServer -PperfTest. This applies the
            // quiet game rules; the FLAT preset and the pinned seed come from run/server.properties
            // (level-type=dungeontrain\:dungeon_train_flat + level-seed), because a dedicated server
            // creates its world from those rather than from the client's quick-world path.
            // scripts/perf/ writes both.
            if (project.hasProperty('perfTest')) {
                systemProperty 'dungeontrain.perfTest', 'true'
            }
            if (project.hasProperty('perfSeed')) {
                systemProperty 'dungeontrain.perfSeed', project.property('perfSeed').toString()
            }
        }

        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                '--output', file('src/generated/resources/').getAbsolutePath(),
                '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    unitTest {
        enable()
        testedMod = mods.named(mod_id)
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime

    // Sable bundles its `sable-companion` library as a jar-in-jar inside the
    // mod jar (META-INF/jarjar/sable-companion-common-*.jar). At runtime
    // NeoForge unpacks and loads it; at compile time we have to extract it
    // ourselves so the companion's math types (Pose3d, BoundingBox3d) are
    // visible to javac.
    sableJar
}

dependencies {
    sableJar "maven.modrinth:sable:${sable_version}"
}

tasks.register('extractSableCompanion', Copy) {
    def sableJar = configurations.sableJar
    inputs.files(sableJar)
    from {
        sableJar.collect { zipTree(it).matching {
            include 'META-INF/jarjar/sable-companion-common-*.jar'
        } }
    }
    into layout.buildDirectory.dir('extracted/sable-companion')
    eachFile { details ->
        // Strip the META-INF/jarjar/ prefix so files() can pick the jar up directly.
        details.path = details.sourceName
    }
    includeEmptyDirs = false
}

dependencies {
    // joml-primitives supplies AABBdc used by ManagedShip.worldAABB().
    // Pre-migration this came in transitively via VS jar-in-jar; with VS
    // stubbed we add it ourselves. `additionalRuntimeClasspath` is needed in
    // addition to compile/runtime so it lands on the moddev launch classpath
    // (runClient / runServer); plain `runtimeOnly` is not enough there.
    // `jarJar` embeds it in the shipped mod jar for end-user production builds.
    compileOnly 'org.joml:joml-primitives:1.10.0'
    additionalRuntimeClasspath 'org.joml:joml-primitives:1.10.0'
    jarJar(group: 'org.joml', name: 'joml-primitives', version: '[1.10.0,2.0)') {
        version {
            prefer '1.10.0'
        }
    }

    // Sable — physics dependency (replaces VS in Phase 2). Modrinth-hosted.
    // End users must install Sable separately at runtime; it is NOT embedded
    // in our jar (PolyForm Shield 1.0.0 — Sable's licence — does not allow
    // bundling), and we declare it as a hard `mandatory` mod-dep in
    // neoforge.mods.toml so the loader prompts the user.
    implementation "maven.modrinth:sable:${sable_version}"

    // AdventureItemNames — sibling mod by the same author. NOT bundled: it is a
    // separate required download, the same distribution contract as Sable above,
    // so that AIN's own Modrinth/CurseForge pages get credited for the install.
    // (Bundling would be legally fine — we own the copyright — but it made those
    // pages invisible to every DT player.)
    //
    // `implementation` (not `additionalRuntimeClasspath` like joml-primitives)
    // because AIN ships its own `META-INF/neoforge.mods.toml` and must be
    // discoverable by FML as a *mod* on every runtime classpath — including
    // the JUnit test launcher (the `unitTest` block at line 91), which inherits
    // from `runtimeClasspath` but not from the moddev-specific
    // `additionalRuntimeClasspath`. Sable above uses the same `implementation`
    // pattern for the same reason; joml-primitives is a plain library (no
    // mods.toml) so `additionalRuntimeClasspath` suffices for it.
    //
    // This dep supplies the dev-run + compile version. The version END USERS must
    // have is the separate `adventureitemnames_min_version` floor rendered into
    // neoforge.mods.toml — see gradle.properties for why the two are split.
    implementation "bh679:adventureitemnames:${adventureitemnames_version}"

    // AdventureItemStats — same external-required-dep contract as AIN above
    // (sibling mod, same author, same Ivy repo via the bh679 group). See
    // gradle.properties for the version + Modrinth/CurseForge status comment.
    implementation "bh679:adventureitemstats:${adventureitemstats_version}"

    // PlayerMob (Interactive Player Mobs) — same external-required-dep contract as
    // AIN/AIS above (sibling mod, same author, same Ivy repo via the bh679 group).
    // See gradle.properties for the version + Modrinth/CurseForge status comment.
    implementation "bh679:playermob:${playermob_version}"
    // playermob 0.33.0+ ships games.brennan.playermob.compat.PlayerMobSocialHooks
    // (the gift seam). The implementation dep above puts it on the compile classpath,
    // so compat.PlayerMobSocialBridge references it directly — no extra dep needed.

    // Discord Presence (Discord join/online/death notifications + reactions) —
    // one of the two siblings still bundled via jarJar (with EdibleBackpacks below;
    // TradeEverything graduated to an external dep). Its Modrinth project is not public
    // yet (the `discordpresence` slug there belongs to an unrelated third-party
    // mod), so making it an external required dep would leave Modrinth users with
    // no way to obtain it. Unbundle once that listing goes live — at which point
    // this matches AIN/AIS/PMOB/ECP above. DT compiles against its public
    // API: DiscordCredentials/DiscordCredentialsProvider (relay-mode + chat-tag ping
    // triggers + presence tracking) and DiscordService (death reports, and the
    // editor-welcome "last seen online" presence query). `implementation` puts it on
    // the compile classpath and jarJar embeds it into the shipped jar.
    // Configured at runtime in config/discordpresence-server.toml (off by default).
    implementation "bh679:discordpresence:${discordpresence_version}"
    jarJar(group: 'bh679', name: 'discordpresence', version: discordpresence_version)

    // EnderChestPersistence — global Ender Chest persistence across worlds + per-game-mode
    // isolation. Extracted from DT; same external-required-dep contract as AIN/AIS/PMOB above.
    implementation "bh679:enderchestpersistence:${enderchestpersistence_version}"

    // TradeEverything — the villager "Trade Anything" slot (any item exchanges for goods
    // the villager buys, priced by material worth). Same external-required-dep contract as
    // AIN/AIS/PMOB/ECP above; fetched via the shared bh679 Ivy repo (flat asset
    // tradeeverything-neoforge-<v>.jar). Un-bundled from jarJar once the Modrinth
    // (trade-everything) and CurseForge (1622962) listings went live, so the launchers
    // auto-install it and TE's own project page gets the download credit.
    // DT compiles against games.brennan.tradeeverything.api.TradeEverythingApi
    // (compat.TradeEverythingBridge values written books).
    implementation "bh679:tradeeverything:${tradeeverything_version}"

    // EdibleBackpacks — eat a backpack for +1 persistent backpack slot. TEMPORARILY
    // jarJar-bundled (like DiscordPresence) until its Modrinth/CurseForge
    // listings are approved; then flip to the external-required-dep contract + modpack
    // entry. DT compiles against EdibleBackpacksApi to opt DT worlds into reset-on-death.
    implementation "bh679:ediblebackpacks:${ediblebackpacks_version}"
    jarJar(group: 'bh679', name: 'ediblebackpacks', version: ediblebackpacks_version)

    // Compile against the companion math types extracted from Sable's
    // jar-in-jar bundle. compileOnly because at runtime the companion is
    // loaded by NeoForge from Sable's own jarJar — we don't ship it.
    // fileTree (not files-of-task) so javac sees the .jar inside the
    // directory; builtBy wires the extraction so it runs before compile.
    compileOnly fileTree(dir: layout.buildDirectory.dir('extracted/sable-companion'),
                         include: '*.jar',
                         builtBy: ['extractSableCompanion'])

    // Unit tests — JUnit 5 Jupiter (pure-logic only).
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // joml-primitives again, this time for the JUnit launcher. It is `compileOnly` +
    // `additionalRuntimeClasspath` above, and the test launcher inherits from `runtimeClasspath` but
    // not from the moddev-specific one — so without this the type is simply absent under
    // `./gradlew test`. That is not a theoretical gap: FML resolves the descriptor of every declared
    // method when it registers an `@EventBusSubscriber`, so one method signature naming `AABBdc`
    // fails DT's whole construction with a NoClassDefFoundError, and every test in the run reports
    // "Could not start Gradle Test Executor" instead of naming the cause. Test-scoped, so nothing
    // about the shipped jar or either run classpath changes.
    testImplementation 'org.joml:joml-primitives:1.10.0'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

// Resolve the current git branch at configuration time so it can be baked into
// the jar via processResources. Falls back to the short SHA on detached HEAD.
//
// Strict branch-ref detection: only the literal `main` ref counts as a release
// build. Worktrees / feature branches that sit at main's tip with no extra
// commits still bake their own branch name and therefore show the dev title
// screen (see DevQuickWorldHandler). The branch ref — not the commit hash — is
// the dev-vs-release signal.
def gitBranch = { ->
    try {
        def proc = ['git', 'rev-parse', '--abbrev-ref', 'HEAD']
                .execute(null, project.projectDir)
        proc.waitForOrKill(5000)
        def name = proc.in.text.trim()
        if (name == 'HEAD' || name.isEmpty()) {
            def p2 = ['git', 'rev-parse', '--short', 'HEAD']
                    .execute(null, project.projectDir)
            p2.waitForOrKill(5000)
            def sha = p2.in.text.trim()
            return sha ?: 'unknown'
        }
        return name
    } catch (Exception e) {
        logger.warn("Could not resolve git branch for version resource: {}", e.message)
        return 'unknown'
    }
}()

// Total hours of development behind the mod, shown on the death screen's Contribute page.
//
// The unit is a CLOCK HOUR, not a commit and not a repo-hour: an hour in which commits landed
// in dungeon-train-mc *and* playermob-mc *and* dp-relay is ONE hour. Both sources below are
// therefore unioned as a SET of hour buckets — nothing adds two counts together.
//
// Two sources, because neither alone is right:
//   - docs/dev-hours/hour-index.json — a committed snapshot spanning every repo the project
//     spans, produced by scripts/dev-hours/collect.py. The sibling repos are not checked out
//     when this builds (not in CI, not on another machine), so their hours can only arrive
//     pre-computed. Refreshed by re-running that script; stale between runs.
//   - the live git history of THIS checkout, so Dungeon Train's own hours are always current
//     without re-running anything. This is also what makes a shallow CI clone harmless: the
//     snapshot already carries DT's full history, and the live pass only ever adds.
//
// Every failure path degrades instead of breaking the build — a missing index, no git, a
// corrupt file. Worst case the value is 0, and the screen simply omits the line.
def devHours = { ->
    var hours = new HashSet<Long>()

    var indexFile = file('docs/dev-hours/hour-index.json')
    try {
        if (indexFile.exists()) {
            // `hours` is delta-encoded (first absolute, then gaps) to keep the committed
            // index small — see collect.py's delta_encode.
            var encoded = new groovy.json.JsonSlurper().parse(indexFile).hours as List
            long running = 0
            encoded.eachWithIndex { step, i ->
                running = (i == 0) ? (step as long) : running + (step as long)
                hours.add(running)
            }
        } else {
            logger.info('dev-hours: {} absent — using this checkout\'s history only', indexFile)
        }
    } catch (Exception e) {
        logger.warn('dev-hours: could not read {}: {}', indexFile, e.message)
    }

    try {
        // %ad is the AUTHOR date in the author's own timezone — the wall clock the work
        // happened on. Read back as UTC purely to get a stable integer key, matching collect.py.
        var proc = ['git', 'log', '--all', '--pretty=%ad', '--date=format:%Y-%m-%dT%H']
                .execute(null, project.projectDir)
        var out = new StringBuilder()
        var err = new StringBuilder()
        proc.consumeProcessOutput(out, err)   // drain first: this output is thousands of lines
        proc.waitForOrKill(30000)
        out.toString().eachLine { line ->
            var stamp = line.trim()
            if (stamp.isEmpty()) return
            try {
                hours.add(java.time.LocalDateTime.parse(stamp + ':00')
                        .toEpochSecond(java.time.ZoneOffset.UTC).intdiv(3600))
            } catch (Exception ignored) { /* not a timestamp — skip the line */ }
        }
    } catch (Exception e) {
        logger.warn('dev-hours: could not read git history: {}', e.message)
    }

    if (hours.isEmpty()) logger.warn('dev-hours: no history found — the Contribute page will omit the line')
    return hours.size()
}()

// How many updates have shipped, and when the newest one landed — the pair the death screen's
// donation page shows once the running costs are met. An "update" is a MINOR version bump: one
// per Gate 3 merge. The cascade's PATCH ticks are excluded, or automation would treble the count.
//
// These are the OFFLINE FALLBACK. The live figures come from the relay (which polls the same
// committed index over HTTP and re-derives them daily); these only render when that fetch fails,
// so a stale window on an old jar is the point at which the numbers stop moving, not a bug.
//
// Two sources, unioned per-day by MAX, for the same reason dev-hours has two:
//   - docs/version-history/index.json — a committed snapshot from scripts/version-history/collect.py,
//     which is all a shallow CI clone has to go on.
//   - the live git history of THIS checkout, so a dev build counts today's merges too.
// Both count the same events, so the larger count for a given day is the more complete one.
//
// Every failure path degrades: a missing index, no git, a corrupt file. Worst case the count is
// 0, which callers read as UNKNOWN and the screen omits the line rather than claiming zero work.
def updateStats = { ->
    var daily = new TreeMap<String, Integer>()
    var addDay = { String day, int n -> daily[day] = Math.max(daily[day] ?: 0, n) }

    var indexFile = file('docs/version-history/index.json')
    try {
        if (indexFile.exists()) {
            var parsed = new groovy.json.JsonSlurper().parse(indexFile)
            (parsed.daily ?: [:]).each { day, n -> addDay(day as String, n as int) }
        } else {
            logger.info('version-history: {} absent — using this checkout\'s history only', indexFile)
        }
    } catch (Exception e) {
        logger.warn('version-history: could not read {}: {}', indexFile, e.message)
    }

    try {
        // Mirrors collect.py: one `+mod_version=` line per commit that changed it, kept only
        // when its MAJOR.MINOR differs from the version before it.
        var proc = ['git', 'log', '--reverse', '--format=%x00%ad', '--date=short',
                    '-p', '--', 'gradle.properties'].execute(null, project.projectDir)
        var out = new StringBuilder()
        var err = new StringBuilder()
        proc.consumeProcessOutput(out, err)   // drain first: this output is thousands of lines
        proc.waitForOrKill(60000)
        var live = new TreeMap<String, Integer>()
        String when = null
        String seen = null
        String previousMinor = null
        out.toString().eachLine { line ->
            if (line.startsWith('\u0000')) {
                when = line.substring(1).trim() ?: null
                return
            }
            if (!line.startsWith('+mod_version=') || when == null) return
            var version = line.substring('+mod_version='.length()).trim()
            if (version.isEmpty() || version == seen) return
            seen = version
            var parts = version.split('\\.')
            if (parts.length < 2) return
            var minor = parts[0] + '.' + parts[1]
            if (minor == previousMinor) return
            previousMinor = minor
            live[when] = (live[when] ?: 0) + 1
        }
        // The version in gradle.properties right now, when it is a MINOR ahead of the last one
        // in the history — the bump commit's own version isn't in `git log` while it is being
        // built. Mirrors collect.py's with_working_tree.
        var pendingMinor = (mod_version as String).split('\\.').with { it.length >= 2 ? it[0] + '.' + it[1] : null }
        if (pendingMinor != null && pendingMinor != previousMinor) {
            var day = java.time.LocalDate.now().toString()
            live[day] = (live[day] ?: 0) + 1
        }
        live.each { day, n -> addDay(day, n) }
    } catch (Exception e) {
        logger.warn('version-history: could not read git history: {}', e.message)
    }

    if (daily.isEmpty()) {
        logger.warn('version-history: no history found — the death screen will omit the updates card')
        return [count: 0, windowMonths: 0, month: 0, week: 0, day: 0, year: 0, lastUpdate: '']
    }

    var today = java.time.LocalDate.now()
    var first = java.time.LocalDate.parse(daily.firstKey())
    // The window rule, mirrored in collect.py, UpdateStats.java and dp-relay's updates.js: the
    // longest window the card offers is the project's own age rounded UP (so it still covers every
    // update ever shipped), capped at the twelve months the card renders as "1 year".
    var whole = (today.year - first.year) * 12 + (today.monthValue - first.monthValue)
    if (today.dayOfMonth < first.dayOfMonth) whole -= 1
    if (today.dayOfMonth != first.dayOfMonth) whole += 1
    int windowMonths = Math.max(1, Math.min(12, whole))
    var countSince = { java.time.LocalDate from ->
        var key = from.toString()
        daily.findAll { day, n -> day >= key }.values().sum(0) as int
    }
    return [count       : countSince(today.minusMonths(windowMonths)),
            windowMonths: windowMonths,
            month       : countSince(today.minusDays(30)),
            week        : countSince(today.minusDays(7)),
            day         : (daily[today.toString()] ?: 0) as int,
            // Calendar year to date, for the menu's "N changes this year" line. Deliberately not
            // the rolling window above: on a splash "this year" means the calendar.
            year        : countSince(java.time.LocalDate.of(today.year, 1, 1)),
            lastUpdate  : daily.lastKey()]
}()

