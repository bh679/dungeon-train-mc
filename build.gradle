// Generate the "which mods are ours" roster the death screen's Mod Recommendations page measures
// the player's loaded mod list against. The membership facts already exist in two files — the
// mods.toml template (self + hard/embedded deps + declared optionals) and modpack.config.json
// (the companion roster) — so this derives the list from BOTH rather than adding a third
// hand-maintained copy that can silently drift from the modpack we actually ship.
//
// Matching is by normalised key (lowercase, alphanumerics only) and every companion contributes
// TWO keys — its CurseForge slug and its display name — because the config stores slugs while
// ModList reports modIds, and the two disagree often enough ("interactive-player-mobs" is modId
// `playermob`) that slug-only matching would leak our own companions into the grid. A companion
// whose modId matches neither key simply shows up as recommendable: wrong, but harmless and
// obvious the first time you see it.
tasks.register('generateModRoster') {
    var configFile = file('modpack/modpack.config.json')
    var modsTomlFile = file('src/main/templates/META-INF/neoforge.mods.toml')
    var outFile = file("${layout.buildDirectory.get()}/generated/sources/modRoster/assets/${mod_id}/modrec/roster.json")

    inputs.file configFile
    inputs.file modsTomlFile
    outputs.file outFile

    doLast {
        var normalise = { String s -> s == null ? '' : s.toLowerCase().replaceAll('[^a-z0-9]', '') }
        var keys = new TreeSet<String>()

        // Platform ids — never recommendable, and not listed as dependencies everywhere.
        keys.addAll(['minecraft', 'neoforge', 'forge', 'fabric', 'javafml', 'mixin', 'mixinextras'])

        // Self + every modId the mods.toml template declares (hard deps, jarJar'd siblings, and
        // the optional compat entries like Distant Horizons / Tectonic / Vivecraft).
        keys.add(normalise(mod_id as String))
        modsTomlFile.text.findAll(/modId\s*=\s*"([^"]+)"/) { full, id ->
            if (!id.contains('$')) keys.add(normalise(id))  // skip the "${mod_id}" template placeholder
        }

        var config = new groovy.json.JsonSlurper().parse(configFile)
        keys.add(normalise(config.sable?.modrinth_project ?: 'sable'))
        config.optional_mods.each { entry ->
            keys.add(normalise(entry.slug as String))
            keys.add(normalise(entry.name as String))
        }
        // Companions whose modId matches neither their slug nor their display name. Only add an
        // entry here once you have confirmed the real modId from the mod's own neoforge.mods.toml.
        keys.add('iris')  // slug "irisshaders" / name "Iris Shaders", modId `iris`

        // Sable's OWN dependencies. They arrive with Sable rather than through modpack.config.json,
        // so neither source above knows about them — but every Dungeon Train player has them, and
        // offering a player their physics engine's rendering library to recommend is noise. Found by
        // reading the dev client's mod list; keep in step if Sable's dependency set changes.
        keys.add('veil')
        keys.add('sablecompanion')

        // Companions whose modId matches NEITHER their slug nor their display name, found by
        // comparing the live /mods/popular ranking against this roster (2026-08-07). Each was being
        // offered to ~90% of players as something to recommend to us.
        keys.add('highlighter')   // slug "item-highlighter" / name "Item Highlighter"
        keys.add('khi')           // slug "kinetic-hosting-integration" / name "Kinetic Hosting Integration"
        keys.add('sablejade')     // slug "jade-sable-compat" / name "Jade Sable Compat"

        keys.removeAll([''])

        // Raw-modId PREFIXES, matched before normalisation. The Forgified Fabric API that Sinytra
        // Connector brings in registers ~44 separate underscore-namespaced modules
        // (fabric_api_base, fabric_renderer_api_v1, …) and ~92% of players load them. They are
        // platform plumbing, and enumerating them would go stale the moment the set changes.
        // Matched on the raw id so only the underscore namespace matches — a real mod called
        // "Fabric Furniture" normalises to "fabricfurniture" and is untouched.
        var prefixes = ['fabric_']

        outFile.parentFile.mkdirs()
        outFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
            comment: 'GENERATED by the generateModRoster Gradle task — do not edit. '
                   + 'Normalised (lowercase alphanumeric) keys, plus raw-modId prefixes, for every '
                   + 'mod that is part of Dungeon Train or its modpack. '
                   + 'Sources: neoforge.mods.toml + modpack/modpack.config.json.',
            prefixes: prefixes,
            keys   : keys as List,
        ])) + '\n'
    }
}
sourceSets.main.resources.srcDir files("${layout.buildDirectory.get()}/generated/sources/modRoster") {
    builtBy 'generateModRoster'
}
neoForge.ideSyncTask tasks.named('generateModRoster')

