<title>Dungeon Train Perk Constellation</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono&display=swap">
<style>
/* Layout: night-sky editor. Left: the constellation canvas (drag stars). Right: inspector for the selected star or link, plus tools. Single dark theme by choice. */
:root{
  --bg:#070b16; --bg2:#0d1428; --fg:#e8e4d6; --muted:#8e94a8; --line:#2a3350;
  --gold:#e4b95a; --panel:#111a30; --field:#0a1020; --danger:#d9534f;
  --display:"Cinzel",Georgia,serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;box-sizing:border-box}
header{position:fixed;left:0;top:env(safe-area-inset-top,0px);padding:12px max(16px,env(safe-area-inset-left,0px));z-index:6;pointer-events:none;background:linear-gradient(var(--bg),rgba(7,11,22,0));right:0}
.hrow{display:flex;align-items:center;gap:14px}
#tools{pointer-events:auto}
h1{font-family:var(--display);font-weight:500;font-size:clamp(16px,2vw,22px);margin:0;letter-spacing:.04em}
header p{margin:2px 0 0;color:var(--muted);font-size:12px;max-width:46ch}
.wrap{position:fixed;inset:0}
.sky{position:absolute;inset:0;touch-action:none;user-select:none;background:radial-gradient(ellipse at 50% 45%,var(--bg2) 0%,#0c1225 18%,#0a0f1f 36%,#080c19 54%,var(--bg) 72%)}
.sky::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 50%,rgba(228,185,90,.06) 0%,rgba(228,185,90,.03) 14%,rgba(228,185,90,.01) 24%,transparent 32%)}
.sky::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.035;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
.sky svg{position:relative}
svg{width:100%;height:100%;display:block}
svg image{image-rendering:pixelated;image-rendering:crisp-edges}
aside{position:fixed;top:calc(env(safe-area-inset-top,0px) + 58px);right:max(16px,env(safe-area-inset-right,0px));width:max-content;min-width:260px;max-width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 70px);overflow-y:auto;overflow-x:hidden;z-index:3;box-shadow:0 10px 40px rgba(0,0,0,.5);background:rgba(17,26,48,.92);backdrop-filter:blur(6px)}
aside.min{max-height:none;overflow:hidden}
aside.empty{display:none}
aside.min > :not(.tools){display:none!important}
#bMin{margin-left:0}
@media (max-width:860px){header p{display:none}}
.node{cursor:grab}.node.drag{cursor:grabbing}
.node.sel circle.halo{stroke:var(--gold);stroke-opacity:1}
.node.tgt circle.halo{stroke:#fff;stroke-opacity:1;r:13}
.node.pick circle.halo{stroke:#fff;stroke-opacity:.9;stroke-dasharray:2 2}
.lbl{font-family:var(--display);font-size:17px;letter-spacing:.12em;text-transform:uppercase;cursor:grab;paint-order:stroke;stroke:#070b16;stroke-width:4px}
.lbl:hover{text-decoration:underline;text-underline-offset:4px}
.lbl.sel{text-decoration:underline;text-underline-offset:4px;filter:drop-shadow(0 0 6px currentColor)}
.lbl:focus{outline:none}
.rev{filter:drop-shadow(0 0 3px #5fd38a)}
.plbl{font-family:var(--body);font-size:10.5px;font-weight:500;fill:var(--fg);pointer-events:auto;cursor:grab;paint-order:stroke;stroke:#070b16;stroke-width:3px}
.edge{fill:none;stroke-width:1.2;stroke-opacity:.55;cursor:pointer}
.edge.cross{stroke:var(--gold);stroke-opacity:.5;stroke-dasharray:3 4;stroke-width:1}
.edge.ghost{pointer-events:none;stroke-opacity:.9;stroke-width:1.6}
.edge.req.ghost{stroke-dasharray:5 4}
.edge.ghost.cross{stroke-dasharray:3 4}
.edge.mcunder{stroke:#101418;stroke-width:5.5;stroke-opacity:1;pointer-events:none}
.edge.mc{stroke-width:2.6;stroke-opacity:.95}
.edge.mc.cross{stroke-dasharray:6 5;stroke-width:2.2}
.edge.sel{stroke:#fff;stroke-opacity:1;stroke-width:2}
.edgehit{fill:none;stroke:transparent;stroke-width:9;cursor:pointer}
aside{border:1px solid var(--line);border-radius:4px;padding:8px;min-width:0;display:flex;flex-direction:column;gap:6px;font-size:12px}
aside h2{font-family:var(--display);font-weight:500;margin:0;font-size:13px;letter-spacing:.06em}
.tools{display:flex;flex-wrap:nowrap;gap:6px;align-items:center}
button{font:inherit;font-size:11px;background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:3px 7px;cursor:pointer}
button:hover{color:var(--fg)}
button:hover{border-color:var(--gold)}button.on{background:var(--gold);color:#070b16;border-color:var(--gold)}
button.danger{border-color:transparent;color:var(--danger);padding-left:0}
button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
label{display:grid;gap:2px;color:var(--muted);font-size:10px;letter-spacing:.06em;text-transform:uppercase}
input,textarea,select{font:inherit;font-size:12px;background:transparent;color:var(--fg);border:0;border-bottom:1px solid var(--line);border-radius:0;padding:3px 0;width:100%;box-sizing:border-box}
input:focus,textarea:focus,select:focus{outline:none;border-bottom-color:var(--gold)}
textarea{min-height:0;resize:none;overflow:hidden;font-family:var(--body);line-height:1.35}
.hint{color:var(--muted);font-size:11px;line-height:1.4;margin:0}
#inspector>.hint:last-child{white-space:normal}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.line{display:flex;align-items:center;gap:8px}
.line .danger{padding:0 2px;font-size:14px;line-height:1}
.tools{gap:4px}
.sw{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:4px}
.foot{display:flex;gap:10px;margin-top:2px}
.lnk{border:0;padding:0 3px;font-size:13px;color:var(--muted);background:none;line-height:1}
.tools .lnk:first-of-type{margin-left:0}
.lnk.on{color:var(--gold)}
.xclose{font-size:16px;line-height:1;padding:0 2px}
.xclose:hover{color:var(--fg)}
#bRev.on{color:#5fd38a}
.sec{display:grid;gap:6px;padding-top:4px}
.sec[hidden],.ctx[hidden]{display:none}
.mono{font-family:var(--mono);font-size:11px}
.ctx{position:fixed;z-index:9;background:rgba(17,26,48,.96);border:1px solid var(--line);border-radius:4px;padding:4px;display:grid;min-width:130px;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.ctx button{border:0;text-align:left;padding:5px 8px;font-size:12px;color:var(--fg);background:none;border-radius:3px}
.ctx button:hover{background:var(--field);color:var(--gold)}
.ctx button.danger{color:var(--danger)}
.tview{position:fixed;inset:0;z-index:1;overflow:auto;padding:70px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.tview[hidden]{display:none}
.tinner{margin:0 auto}
.tinner{max-width:none;margin:0}
.tables{display:flex;flex-wrap:nowrap;gap:28px;align-items:flex-start;overflow-x:auto;padding-bottom:16px}
.ct{border-collapse:collapse;flex:0 0 380px;width:380px;font-size:13px}
.ct td.ds{white-space:normal}
#ptable th{text-align:left;color:var(--muted);font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:6px 8px;border-bottom:1px solid var(--line)}
#ptable td{padding:6px 8px;border-bottom:1px solid rgba(42,51,80,.5);vertical-align:top}
#ptable td.cls{font-family:var(--display);letter-spacing:.06em;white-space:nowrap}
#ptable .cnt{font-family:var(--body);font-size:11px;letter-spacing:0;color:var(--muted);margin-top:2px}
#ptable td.nm{white-space:nowrap;cursor:pointer}
#ptable td.nm:hover{color:var(--gold)}
#ptable td.ds{color:var(--fg);opacity:.85}
#ptable .tick{color:#5fd38a}
#ptable td.go{width:22px;padding-right:0}
#ptable .goto{font-size:14px;padding:0}
#ptable tr.hl td{background:rgba(228,185,90,.12)}
.status{color:var(--gold);font-size:11px}
.status:empty{display:none}
#inspector{display:grid;gap:4px}
#inspector>input:first-child{margin-top:-2px}
</style>

<header>
  <div class="hrow"><h1>Dungeon Train Perk Constellation</h1>
    <div class="tools" id="tools">
      <button hidden id="bAddPerk" title="Add a perk beside the selected one">+ perk</button>
      <button hidden id="bAddClass" title="Add a class">+ class</button>
      <button hidden id="bLinkReq" title="Link two perks">link</button>
      <button hidden id="bLinkX" title="Cross-link two perks (dashed)">chord</button>
      <button class="lnk" id="bStyle" title="visual style: sky / minecraft">▣</button>
      <button class="lnk" id="bRev" title="show reviewed rings">✓</button>
      <button class="lnk" id="bGuide" title="alignment guide: a circle through the furthest perk, and the centre ring">◯</button>
      <button class="lnk" data-t="classes" title="classes">⌘</button><button class="lnk" data-t="io" title="save / load">⇅</button>
      <button class="lnk" id="bTable" title="table view">☰ table</button>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="sky"><svg viewBox="0 0 800 800" preserveAspectRatio="xMidYMid meet" aria-label="Perk constellation editor"></svg></div>
  <aside id="aside">
    <div class="status" id="status"></div>
    <div id="inspector"></div>
    <div id="classes" class="sec" hidden></div>
    <div id="io" class="sec" hidden>
      <div class="tools"><button id="bCopy">copy JSON</button><button id="bLoad">load</button><button id="bReset" class="danger">reset</button></div>
      <textarea id="json" class="mono" placeholder="paste JSON, then load"></textarea>
      <p class="hint">To publish: copy JSON here, then paste it into the publish box on brennan.games/dungeontrain/perks.</p>
    </div>
  </aside>
</div>
<div id="ctx" class="ctx" hidden></div>
<div id="tableView" class="tview" hidden><div class="tinner"><div id="ptable" class="tables"></div></div></div>

document.getElementById("bCopy").onclick=async()=>{const t=JSON.stringify(M,null,1);document.getElementById("json").value=t;try{await navigator.clipboard.writeText(t);status("JSON copied")}catch(e){document.getElementById("json").select();status("Select all in the box and copy")}};
document.getElementById("bLoad").onclick=()=>{try{const m=JSON.parse(document.getElementById("json").value);if(!m.perks||!m.classes||!m.links)throw 0;M=m;M.v=M.v??MIGRATIONS.length;sel=null;selLink=null;save();render();status("Loaded")}catch(e){status("That is not a constellation JSON")}};
document.getElementById("bReset").onclick=()=>{if(document.getElementById("bReset").dataset.arm){M=defaultModel();M.v=0;while(M.v<MIGRATIONS.length){try{MIGRATIONS[M.v](M)}catch(e){}M.v++}sel=null;selLink=null;save();render();status("Reset");delete document.getElementById("bReset").dataset.arm;document.getElementById("bReset").textContent="Reset to default"}else{document.getElementById("bReset").dataset.arm="1";document.getElementById("bReset").textContent="Click again to confirm reset"}};
document.querySelectorAll(".lnk[data-t]").forEach(b=>b.onclick=()=>{const t=document.getElementById(b.dataset.t);t.hidden=!t.hidden;b.classList.toggle("on",!t.hidden);render()});

let showTable=false;const bTable=document.getElementById("bTable");
function reachable(){const adj=new Map();M.links.forEach(l=>{if(!adj.has(l.a))adj.set(l.a,[]);if(!adj.has(l.b))adj.set(l.b,[]);adj.get(l.a).push(l.b);adj.get(l.b).push(l.a)});const seen=new Set(["root"]);const q=["root"];while(q.length){const x=q.pop();(adj.get(x)||[]).forEach(y=>{if(!seen.has(y)){seen.add(y);q.push(y)}})}return seen}
function renderTable(){const t=document.getElementById("ptable");t.replaceWith(Object.assign(document.createElement("div"),{id:"ptable",className:"tables"}));const host=document.getElementById("ptable");const live=reachable();const order=M.classes.map(c=>{const ps=M.perks.filter(p=>p.cls===c.id&&live.has(p.id));if(!ps.length)return null;const sx=ps.reduce((a,p)=>a+(p.x-CX),0),sy=ps.reduce((a,p)=>a+(p.y-CY),0);return {c,a:(Math.atan2(sy,sx)+Math.PI/2+2*Math.PI)%(2*Math.PI),ps:ps.sort((u,v)=>Math.hypot(u.x-CX,u.y-CY)-Math.hypot(v.x-CX,v.y-CY))}}).filter(Boolean).sort((u,v)=>u.a-v.a);
  let h="";order.forEach(o=>{h+=`<table class="ct"><tr><th></th>${showRev?"<th></th>":""}<th>class</th><th>perk</th><th>description</th></tr>`;o.ps.forEach((p,i)=>{h+=`<tr data-row="${p.id}"${sel===p.id?' class="hl"':""}><td class="go"><button class="lnk goto" data-id="${p.id}" title="show on the graph">◎</button></td>${showRev?`<td class="tick">${p.reviewed?"✓":""}</td>`:""}<td class="cls" style="color:${o.c.color}">${i===0?esc(o.c.name):""}${(i===1||(i===0&&o.ps.length===1))?`<div class="cnt">${o.ps.length} perk${o.ps.length===1?"":"s"}</div>`:""}</td><td class="nm" data-id="${p.id}">${esc(p.name)}</td><td class="ds">${esc(p.desc||"")}</td></tr>`});h+="</table>"});host.innerHTML=h;const t2=host;
  const go=id=>{sel=id;selLink=null;selCls=null;toggleTable(false);render()};t2.querySelectorAll("td.nm").forEach(td=>td.onclick=()=>go(td.dataset.id));t2.querySelectorAll("button.goto").forEach(b=>b.onclick=e=>{e.stopPropagation();go(b.dataset.id)});
  const hl=t2.querySelector("tr.hl");if(hl)hl.scrollIntoView({block:"center"})}
function toggleTable(on){showTable=on??!showTable;document.getElementById("tableView").hidden=!showTable;document.querySelector(".sky").hidden=showTable;bTable.textContent=showTable?"✦ graph":"☰ table";bTable.classList.toggle("on",showTable);if(showTable)renderTable()}
bTable.onclick=()=>toggleTable();
const bStyle=document.getElementById("bStyle");bStyle.classList.toggle("on",style==="mc");bStyle.onclick=()=>{style=style==="sky"?"mc":"sky";bStyle.classList.toggle("on",style==="mc");try{localStorage.setItem("dt-perk-style",style)}catch(e){}render()};
const bGuide=document.getElementById("bGuide");bGuide.classList.toggle("on",showGuide);bGuide.onclick=()=>{showGuide=!showGuide;bGuide.classList.toggle("on",showGuide);try{localStorage.setItem("dt-perk-guide",showGuide?"1":"0")}catch(e){}renderSky()};
const bRev=document.getElementById("bRev");bRev.classList.toggle("on",showRev);bRev.onclick=()=>{showRev=!showRev;bRev.classList.toggle("on",showRev);try{localStorage.setItem("dt-perk-showrev",showRev?"1":"0")}catch(e){}renderSky();if(showTable)renderTable()};
svg.addEventListener("pointerdown",e=>{if(e.button!==0||e.altKey||e.ctrlKey)return;if(e.target===svg||e.target.parentNode===stars){if(mode){mode=null;pick=null;setModeButtons();status("")}sel=null;selLink=null;selCls=null;render()}});

const ctx=document.getElementById("ctx");
function showMenu(x,y,items){ctx.innerHTML="";items.forEach(([t,f,cls])=>{const b=document.createElement("button");b.textContent=t;if(cls)b.className=cls;b.onclick=()=>{hideMenu();f()};ctx.appendChild(b)});ctx.hidden=false;
  ctx.style.left=Math.min(x,innerWidth-ctx.offsetWidth-8)+"px";ctx.style.top=Math.min(y,innerHeight-ctx.offsetHeight-8)+"px"}
function hideMenu(){ctx.hidden=true}
document.addEventListener("pointerdown",e=>{if(!ctx.contains(e.target)&&e.button===0&&!e.altKey&&!e.ctrlKey)hideMenu()});
function openMenu(e){const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const q=pt.matrixTransform(svg.getScreenCTM().inverse());
  const hitE=e.target.closest(".edgehit");
  if(hitE){const li=+hitE.dataset.li;const l=M.links[li];if(!l)return;selLink=li;sel=null;selCls=null;render();
    showMenu(e.clientX,e.clientY,[[l.kind==="cross"?"make plain link":"make chord",()=>{l.kind=l.kind==="cross"?"req":"cross";save();render()}],[l.oneWay?"make two-way":"make one-way",()=>{l.oneWay=!l.oneWay;save();render()}],["flip direction",()=>{[l.a,l.b]=[l.b,l.a];save();render()}],["delete link",()=>{M.links.splice(li,1);selLink=null;save();render()},"danger"]]);return}
  const g=e.target.closest(".node");const lbl=e.target.closest(".lbl");
  if(g){const p=M.perks.find(pp=>pp.id===g.dataset.id);if(!p)return;sel=p.id;selLink=null;selCls=null;render();
    const startLink=k=>{mode=k;pick=p.id;mouse={x:p.x,y:p.y};hoverId=null;setModeButtons();status(k==="req"?"Click the perk to link to":"Click the perk to chord to")};
    const items=[["link from here",()=>startLink("req")],["chord from here",()=>startLink("cross")],["+ perk from here",()=>document.getElementById("bAddPerk").click()],["duplicate perk",()=>{const ang=Math.atan2(p.y-CY,p.x-CX);const np={id:uid(),cls:p.cls,name:p.name,desc:p.desc,cost:p.cost,tier:tierOf(p),x:+(p.x+Math.cos(ang+Math.PI/2)*34).toFixed(1),y:+(p.y+Math.sin(ang+Math.PI/2)*34).toFixed(1)};M.perks.push(np);M.links.filter(l=>l.a===p.id||l.b===p.id).forEach(l=>M.links.push({a:l.a===p.id?np.id:l.a,b:l.b===p.id?np.id:l.b,kind:l.kind,oneWay:l.oneWay}));M.links.push({a:p.id,b:np.id,kind:"req",oneWay:false});sel=np.id;selLink=null;selCls=null;save();render();document.getElementById("pname")?.select()}]];
    if(p.id!=="root")items.push(["delete perk",()=>{M.perks=M.perks.filter(x=>x.id!==p.id);M.links=M.links.filter(l=>l.a!==p.id&&l.b!==p.id);sel=null;save();render()},"danger"]);
    showMenu(e.clientX,e.clientY,items);return}
  if(lbl){showMenu(e.clientX,e.clientY,[["+ class",()=>document.getElementById("bAddClass").click()]]);return}
  showMenu(e.clientX,e.clientY,[["+ perk here",()=>{const c=sel&&byId(sel)?.cls||M.classes[0]?.id||null;const np={id:uid(),cls:c,name:"New perk",desc:"",cost:"1",x:+q.x.toFixed(1),y:+q.y.toFixed(1)};M.perks.push(np);sel=np.id;selLink=null;selCls=null;save();render();document.getElementById("pname")?.select()}],["+ class",()=>document.getElementById("bAddClass").click()],["space classes evenly",()=>{respace(M);save();render()}]])}
svg.addEventListener("contextmenu",e=>{e.preventDefault();e.stopPropagation()});
document.addEventListener("contextmenu",e=>{if(e.target.closest("svg"))e.preventDefault()});
let lp=null;
svg.addEventListener("pointerdown",e=>{if(e.button===2||(e.button===0&&(e.altKey||e.ctrlKey))){e.preventDefault();e.stopPropagation();openMenu(e);return}
  if(e.button===0){const sx=e.clientX,sy=e.clientY;lp=setTimeout(()=>{openMenu({target:e.target,clientX:sx,clientY:sy})},550);
    const clear=()=>{clearTimeout(lp);window.removeEventListener("pointerup",clear);window.removeEventListener("pointermove",mv)};const mv=ev=>{if(Math.hypot(ev.clientX-sx,ev.clientY-sy)>6)clear()};
    window.addEventListener("pointerup",clear);window.addEventListener("pointermove",mv)}},true);
svg.addEventListener("auxclick",e=>{if(e.button===2){e.preventDefault()}});

svg.addEventListener("pointermove",e=>{if(!(mode&&pick))return;const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const q=pt.matrixTransform(svg.getScreenCTM().inverse());mouse={x:q.x,y:q.y};if(!hoverId)renderSky()});
document.addEventListener("keydown",e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="z"){e.preventDefault();if(e.shiftKey)redo();else undo();return}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="y"){e.preventDefault();redo();return}
if(e.key==="Escape"){hideMenu();hoverId=null;mouse=null;mode=null;pick=null;setModeButtons();status("");render()}});
render();
</script>
