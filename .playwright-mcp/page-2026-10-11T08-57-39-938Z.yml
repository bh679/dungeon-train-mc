    - generic [ref=e59]:
      - heading "Approved mods" [level=1] [ref=e60]
      - paragraph [ref=e61]: Which mods a run may have installed and still count. Anything installed and not approved makes the session Free Play — but only while enforcement is on. Changes reach every copy of the mod that is already out there on its next launch (the endpoint is edge-cached for 5 minutes).
      - generic [ref=e62]:
        - heading "Enforcement" [level=2] [ref=e63]
        - paragraph [ref=e64]:
          - generic [ref=e65]: ENFORCING — unapproved mods cost players their progress
        - paragraph [ref=e66]:
          - strong [ref=e67]: 0 of 0 players (0%)
          - text: run at least one unapproved mod and would be in Free Play if this were on. 0 of 0 attributed sessions. 0 sessions come from players who never reported a mod list, so this is a floor, not a total.
        - paragraph [ref=e68]:
          - button "Stop enforcing" [ref=e69] [cursor=pointer]
      - generic [ref=e70]:
        - heading "Verified files" [level=2] [ref=e71]
        - paragraph [ref=e72]: Mod ids can be edited; a jar’s hash cannot. Each file players run is matched to a published Modrinth or CurseForge build of a mod on the list above. A file that matches nothing — a renamed cheat jar, a self-built mod, a release the platforms have not indexed yet — is unverified, and costs the run its progress only while this switch is on.
        - paragraph [ref=e73]:
          - generic [ref=e74]: ENFORCING — unverified files cost players their progress
        - paragraph [ref=e75]:
          - strong [ref=e76]: 135 approved
          - text: · 10 plausible · 3 unknown ·
          - strong [ref=e77]: 39 suspect
          - text: "· 0 revoked of 187 files reported. packages: 10, platform: 135, id_not_approved: 3, packages_mismatch: 39"
        - paragraph [ref=e78]: approved = a published build of an approved mod, or approved by hand · plausible = not a build we can place, but the code inside is that mod’s (a fresh release, a GitHub build) · unknown = we have no package knowledge for one of its ids yet · suspect = the code is NOT the mod it claims, a cheat project, or no mod ids. Only suspect and revoked cost a run.
        - paragraph [ref=e79]:
          - strong [ref=e80]: 0 of 0 players
          - text: who report file hashes carry a suspect file and would be in Free Play if this were on. 0 players run a jar that does not report file hashes yet. Flip only at zero, or when every file below is a known bad actor.
        - paragraph [ref=e81]:
          - button "Stop enforcing files" [ref=e82] [cursor=pointer]
        - heading "Review queue (42)" [level=3] [ref=e83]
        - paragraph [ref=e84]: Suspect first, then most-reported. “packages_mismatch” = the code is not the claimed mod’s; “cheat_project” / “cheat_id” = a known cheat; “no_mod_ids” = declares nothing; “no_package_knowledge” = run pull-approved-hashes.py for that id; “no_fingerprint” = an older jar sent no packages; “id_not_approved” = a real published file of a mod not on the list above.
